[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "asterix-codec"
version = "0.1.0"
description = "Schema-driven Python implementation of EUROCONTROL ASTERIX"
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
authors = [{name = "Asterix contributors"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.14"]
kody = ["fastapi>=0.120", "pydantic>=2", "uvicorn>=0.38"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asterix = ["schemas/**/*.json.gz", "schemas/*.json", "schemas/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

