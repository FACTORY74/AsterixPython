[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "asterix-codec"
version = "0.1.0"
description = "Schema-driven Python implementation of EUROCONTROL ASTERIX"
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
authors = [{name = "Asterix contributors"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.18",
  "pre-commit>=4",
  "pytest>=8",
  "pytest-cov>=6",
  "ruff>=0.14",
]
kody = ["fastapi>=0.120", "pydantic>=2", "uvicorn>=0.38"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asterix = ["schemas/**/*.json.gz", "schemas/*.json", "schemas/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.15"
files = ["src", "examples", "tools"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

[tool.coverage.run]
source = ["asterix"]

[tool.coverage.report]
fail_under = 85
show_missing = true

